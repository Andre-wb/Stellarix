services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stellarix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stellarix}
      POSTGRES_DB: ${POSTGRES_DB:-stellarix}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stellarix} -d ${POSTGRES_DB:-stellarix}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-stellarix}:${POSTGRES_PASSWORD:-stellarix}@db:5432/${POSTGRES_DB:-stellarix}
      USERNAME_SECRET: ${USERNAME_SECRET:-change_me_in_production}
      SESSION_SECRET: ${SESSION_SECRET:-change_me_in_production}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BIND_ADDR: 0.0.0.0:8000
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  pgdata:

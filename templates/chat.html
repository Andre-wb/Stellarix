{% extends "base.html" %}

{% block title %}Чат по звуку{% endblock %}

{% block main %}
<div class="wave-page"><canvas id="wave-bg"></canvas></div>

<div class="scene">
    <section class="chat-window">
        <div class="chat-top">
            <span class="chat-user">{{ username }}</span>
            <div class="chat-top-actions">
                <button id="listen-btn" class="chip-btn" type="button">Слушать</button>
                <button id="stop-listen-btn" class="chip-btn" type="button" style="display:none;">Стоп и распознать</button>
                <button id="stop-send-btn" class="chip-btn" type="button" style="display:none;">Отменить передачу</button>
            </div>
        </div>

        <div id="chat-banner" class="chat-banner" style="display:none;"></div>

        <div id="chat-messages" class="chat-feed"></div>

        <div id="mic-level" class="chat-meta-line"></div>
        <div id="chat-status" class="chat-meta-line">Готово к работе.</div>

        <form id="chat-form" class="chat-form" autocomplete="off">
            <input type="file" id="file-input" style="display:none;">
            <button type="button" id="attach-btn" class="attach-btn" title="Отправить файл звуком · изображения сжимаются автоматически" aria-label="Отправить файл">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M20 11.5 11.6 20a5 5 0 0 1-7-7l8.4-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.4 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"
                          stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <input
                    type="text"
                    id="chat-input"
                    class="form-input"
                    placeholder="Сообщение (до 68 байт)..."
                    maxlength="68"
            >
            <button type="submit" id="send-btn" class="send-btn" title="Отправить" aria-label="Отправить">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M3 11.5 21 3l-8.5 18-2.4-7.1L3 11.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                </svg>
            </button>
        </form>
    </section>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="/static/js/native-modem.js"></script>
<script src="/static/js/e2e-crypto.js"></script>
<script src="/static/js/wave-visualizer.js"></script>
<script src="/static/js/stats.js"></script>
<script src="/static/js/file-policy.js"></script>
<script src="/static/js/image-compress.js"></script>
<script src="/static/js/attach-image.js"></script>
<script src="/static/js/chat.js"></script>
<script>
(function () {
    var canvas = document.getElementById('wave-bg');
    if (!canvas || typeof SoundWave === 'undefined') return;
    SoundWave.attach(canvas);

    // Волна следует за статусом чата, а завершённые передачи
    // сразу записываются в статистику для дашборда.
    var statusEl = document.getElementById('chat-status');
    var levelEl = document.getElementById('mic-level');
    var input = document.getElementById('chat-input');
    var form = document.getElementById('chat-form');

    var lastStatus = '';
    var txStart = 0;
    var txBytes = 0;

    if (form && input) {
        form.addEventListener('submit', function () {
            try {
                txBytes = new TextEncoder().encode(input.value || '').length;
            } catch (e) {
                txBytes = (input.value || '').length;
            }
        });
    }

    function onStatus() {
        var s = statusEl ? (statusEl.textContent || '') : '';
        if (s === lastStatus) return;
        lastStatus = s;

        // режим волны
        if (/передано|получено|Готово|Ошибка/i.test(s)) SoundWave.mode('idle');
        else if (/Шифрую|Передаю|Проигр/i.test(s)) SoundWave.mode('transmit');
        else if (/Слушаю|Записыва|запись|Анализ|распозна/i.test(s)) SoundWave.mode('listen');
        else SoundWave.mode('idle');

        // статистика для дашборда — запись сразу по завершении
        if (typeof StxStats === 'undefined') return;
        if (/Шифрую/.test(s)) {
            txStart = Date.now();
        } else if (/Сообщение передано/.test(s) && txStart) {
            StxStats.record({ kind: 'tx', ok: true, bytes: txBytes, ms: Date.now() - txStart });
            txStart = 0;
        } else if (/^Ошибка/.test(s) && txStart) {
            StxStats.record({ kind: 'tx', ok: false, bytes: txBytes, ms: Date.now() - txStart });
            txStart = 0;
        } else if (/Сообщение получено/.test(s)) {
            StxStats.record({ kind: 'rx', ok: true });
        } else if (/Ошибка расшифровки/.test(s)) {
            StxStats.record({ kind: 'rx', ok: false });
        }
    }

    function syncLevel() {
        var m = (levelEl ? levelEl.textContent || '' : '').match(/#+/);
        if (m) SoundWave.level((m[0].length / 20) * 0.16);
    }

    if (statusEl) new MutationObserver(onStatus).observe(statusEl, { childList: true, characterData: true, subtree: true });
    if (levelEl) new MutationObserver(syncLevel).observe(levelEl, { childList: true, characterData: true, subtree: true });
})();
</script>
{% endblock %}
